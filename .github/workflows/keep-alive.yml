name: Keep-alive ping

# Pings the /health endpoint on a schedule so Supabase doesn't auto-pause the
# project after a period of inactivity, and keeps the Azure App Service warm.
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        # Retries tolerate a cold-start hiccup (F1 tier has no Always On, so the
        # first request after idle can transiently fail while the app wakes up)
        run: curl -fsS --retry 5 --retry-delay 10 --retry-all-errors https://sh-entry-portal-app.azurewebsites.net/health
